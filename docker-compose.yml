services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskflow}
      POSTGRES_USER: ${POSTGRES_USER:-deskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskflow_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - deskflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskflow} -d ${POSTGRES_DB:-deskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/DeskFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-deskflow};Username=${POSTGRES_USER:-deskflow};Password=${POSTGRES_PASSWORD:-deskflow_dev_password}
      Jwt__Key: ${JWT_KEY:-local-development-only-secret-key-change-before-production-12345}
      Jwt__Issuer: ${JWT_ISSUER:-DeskFlow}
      Jwt__Audience: ${JWT_AUDIENCE:-DeskFlow.Web}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@123!}
      Seed__TechnicianPassword: ${SEED_TECHNICIAN_PASSWORD:-Tech@123!}
      Seed__UserPassword: ${SEED_USER_PASSWORD:-User@123!}
      AllowedOrigins__0: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/deskflow-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  deskflow-postgres: